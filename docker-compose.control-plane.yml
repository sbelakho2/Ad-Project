# Control Plane Docker Compose
# Separate service for system administration
# 
# Usage: docker-compose -f docker-compose.yml -f docker-compose.control-plane.yml up

services:
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      
      # Operator Authentication (separate from customer API)
      - OPERATOR_JWT_SECRET=${OPERATOR_JWT_SECRET:?OPERATOR_JWT_SECRET is required}
      - OPERATOR_SESSION_TTL_HOURS=${OPERATOR_SESSION_TTL_HOURS:-4}
      
      # Operator credentials (bcrypt hashes)
      # Format: email:hash,email2:hash2
      # (JSON map is also accepted for backward compatibility)
      # Generate with: node -e "console.log(require('bcryptjs').hashSync('password', 12))"
      - OPERATOR_CREDENTIALS=${OPERATOR_CREDENTIALS:?OPERATOR_CREDENTIALS is required}

      # Device approvals (email-confirm new devices)
      - DEVICE_APPROVAL_ENABLED=${DEVICE_APPROVAL_ENABLED:-true}
      - DEVICE_APPROVAL_EMAIL_TO=contact@apexmediation.ee
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-https://admin.apexmediation.ee}
      - DEVICE_CHALLENGE_TTL_MINUTES=${DEVICE_CHALLENGE_TTL_MINUTES:-30}

      # SMTP (required when DEVICE_APPROVAL_ENABLED=true)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-contact@apexmediation.ee}
      
      # Database (READ-ONLY role for monitoring)
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-apexmediation}
      - DB_USER=${DB_READONLY_USER:-apex_readonly}
      - DB_PASSWORD=${DB_READONLY_PASSWORD:?DB_READONLY_PASSWORD required}
      - DB_SSL=${DB_SSL:-false}
      
      - DB_OPERATOR_USER=${DB_OPERATOR_USER:-apex_operator}
      - DB_OPERATOR_PASSWORD=${DB_OPERATOR_PASSWORD:?DB_OPERATOR_PASSWORD required}
      
      - DB_BREAKGLASS_USER=${DB_BREAKGLASS_USER:-apex_breakglass}
      - DB_BREAKGLASS_PASSWORD=${DB_BREAKGLASS_PASSWORD:?DB_BREAKGLASS_PASSWORD required}
      
      # Backend metrics endpoint (for app telemetry)
      - BACKEND_METRICS_URL=${BACKEND_METRICS_URL:-http://backend:8080/metrics}
      
      # Host metrics (node-exporter)
      - NODE_EXPORTER_URL=${NODE_EXPORTER_URL:-http://node-exporter:9100/metrics}
      
      # CORS (same-origin only for admin subdomain)
      - CORS_ORIGIN=${CONTROL_PLANE_CORS_ORIGIN:-https://admin.apexmediation.ee}
      
    depends_on:
      - postgres
    networks:
      - ad-stack
    # Do NOT expose to public internet directly - goes through edge reverse proxy
    profiles:
      - production
      - control-plane

networks:
  ad-stack:
    external: true
