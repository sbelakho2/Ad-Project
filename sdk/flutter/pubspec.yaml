name: adproject_sdk
description: AdProject Mediation SDK for Flutter - Cross-platform ad monetization
version: 1.0.0
homepage: https://github.com/adproject/flutter-sdk
repository: https://github.com/adproject/flutter-sdk.git

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.adproject.flutter_sdk
        pluginClass: AdProjectPlugin
      ios:
        pluginClass: AdProjectPlugin
