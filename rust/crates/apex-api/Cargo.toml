[package]
name = "apex-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
apex-analytics = { path = "../apex-analytics" }
apex-audit = { path = "../apex-audit" }
apex-autopilot = { path = "../apex-autopilot" }
apex-billing = { path = "../apex-billing" }
apex-connectors = { path = "../apex-connectors" }
apex-core.workspace = true
apex-lift = { path = "../apex-lift" }
apex-metrics = { path = "../apex-metrics" }
apex-notify = { path = "../apex-notify" }
apex-proof = { path = "../apex-proof" }
apex-ui = { path = "../apex-ui" }
apex-vault = { path = "../apex-vault" }
apex-watch = { path = "../apex-watch" }
async-trait = "0.1"
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "api_latency"
harness = false
