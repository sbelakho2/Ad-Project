[package]
name = "apex-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The isolated operator control plane: Axum server-rendered HTML with its own origin, authentication, sessions and capabilities."

[lints]
workspace = true

[dependencies]
apex-analytics = { path = "../apex-analytics" }
apex-connectors = { path = "../apex-connectors" }
apex-core.workspace = true
apex-metrics = { path = "../apex-metrics" }
apex-ui = { path = "../apex-ui" }
argon2 = "0.5"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
