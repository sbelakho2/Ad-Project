[package]
name = "apex-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apex-ingest"
path = "src/bin/apex-ingest.rs"

[lints]
workspace = true

[dependencies]
apex-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# A local TLS server for the hermetic certificate-verification test; the
# same rustls the production reqwest client already builds with.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
