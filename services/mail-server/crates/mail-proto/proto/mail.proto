syntax = "proto3";

package apex.mail.v1;

// ============================================================================
// Mailstore Core Service
// Central service for message storage and mailbox management
// ============================================================================

service MailstoreService {
  // Message operations
  rpc StoreMessage(StoreMessageRequest) returns (StoreMessageResponse);
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  
  // Mailbox operations
  rpc ListMailboxes(ListMailboxesRequest) returns (ListMailboxesResponse);
  rpc CreateMailbox(CreateMailboxRequest) returns (CreateMailboxResponse);
  rpc DeleteMailbox(DeleteMailboxRequest) returns (DeleteMailboxResponse);
  rpc RenameMailbox(RenameMailboxRequest) returns (RenameMailboxResponse);
  
  // Message listing and search
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  
  // Flag operations
  rpc SetFlags(SetFlagsRequest) returns (SetFlagsResponse);
  rpc GetFlags(GetFlagsRequest) returns (GetFlagsResponse);
  
  // Move/Copy
  rpc MoveMessage(MoveMessageRequest) returns (MoveMessageResponse);
  rpc CopyMessage(CopyMessageRequest) returns (CopyMessageResponse);
  
  // Quota
  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);
  
  // Account management
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc AuthenticateAccount(AuthenticateRequest) returns (AuthenticateResponse);
  
  // IMAP-specific
  rpc GetMailboxStatus(GetMailboxStatusRequest) returns (GetMailboxStatusResponse);
  rpc Expunge(ExpungeRequest) returns (ExpungeResponse);
  
  // Subscriptions (for IDLE)
  rpc SubscribeMailbox(SubscribeMailboxRequest) returns (stream MailboxEvent);
}

// ============================================================================
// Common Types
// ============================================================================

message Envelope {
  string message_id = 1;
  string from = 2;
  repeated string to = 3;
  repeated string cc = 4;
  repeated string bcc = 5;
  string subject = 6;
  int64 date = 7;  // Unix timestamp
  string in_reply_to = 8;
  repeated string references = 9;
}

message MessageFlags {
  bool seen = 1;
  bool answered = 2;
  bool flagged = 3;
  bool deleted = 4;
  bool draft = 5;
  bool recent = 6;
  repeated string custom = 7;
}

message MessageMetadata {
  uint64 uid = 1;
  string blob_hash = 2;  // SHA-256 hash of raw message
  uint64 size = 3;
  int64 internal_date = 4;  // Unix timestamp
  Envelope envelope = 5;
  MessageFlags flags = 6;
}

message Mailbox {
  string name = 1;
  string delimiter = 2;
  repeated string attributes = 3;  // \Noselect, \HasChildren, etc.
  uint64 uidvalidity = 4;
  uint64 uidnext = 5;
  uint32 exists = 6;
  uint32 recent = 7;
  uint32 unseen = 8;
}

message Quota {
  uint64 used_bytes = 1;
  uint64 max_bytes = 2;
  uint32 used_messages = 3;
  uint32 max_messages = 4;
}

// ============================================================================
// Request/Response Messages
// ============================================================================

// Store Message
message StoreMessageRequest {
  string account_id = 1;
  string mailbox = 2;
  bytes raw_message = 3;
  MessageFlags flags = 4;
  int64 internal_date = 5;  // Optional, 0 = now
}

message StoreMessageResponse {
  uint64 uid = 1;
  string blob_hash = 2;
}

// Get Message
message GetMessageRequest {
  string account_id = 1;
  string mailbox = 2;
  uint64 uid = 3;
  bool include_body = 4;
}

message GetMessageResponse {
  MessageMetadata metadata = 1;
  bytes raw_message = 2;  // Only if include_body=true
}

// Delete Message
message DeleteMessageRequest {
  string account_id = 1;
  string mailbox = 2;
  repeated uint64 uids = 3;
}

message DeleteMessageResponse {
  uint32 deleted_count = 1;
}

// List Mailboxes
message ListMailboxesRequest {
  string account_id = 1;
  string reference = 2;
  string pattern = 3;
}

message ListMailboxesResponse {
  repeated Mailbox mailboxes = 1;
}

// Create Mailbox
message CreateMailboxRequest {
  string account_id = 1;
  string name = 2;
  string special_use = 3;  // \Sent, \Drafts, \Junk, \Trash, etc.
}

message CreateMailboxResponse {
  Mailbox mailbox = 1;
}

// Delete Mailbox
message DeleteMailboxRequest {
  string account_id = 1;
  string name = 2;
}

message DeleteMailboxResponse {
  bool success = 1;
}

// Rename Mailbox
message RenameMailboxRequest {
  string account_id = 1;
  string old_name = 2;
  string new_name = 3;
}

message RenameMailboxResponse {
  Mailbox mailbox = 1;
}

// List Messages
message ListMessagesRequest {
  string account_id = 1;
  string mailbox = 2;
  uint64 uid_min = 3;
  uint64 uid_max = 4;
  uint32 limit = 5;
}

message ListMessagesResponse {
  repeated MessageMetadata messages = 1;
}

// Search Messages
message SearchMessagesRequest {
  string account_id = 1;
  string mailbox = 2;
  string query = 3;  // Simple search query
  repeated SearchCriteria criteria = 4;
}

message SearchCriteria {
  string field = 1;  // from, to, subject, body, date, etc.
  string operator = 2;  // eq, contains, before, after, etc.
  string value = 3;
}

message SearchMessagesResponse {
  repeated uint64 uids = 1;
}

// Set Flags
message SetFlagsRequest {
  string account_id = 1;
  string mailbox = 2;
  repeated uint64 uids = 3;
  MessageFlags flags = 4;
  FlagOperation operation = 5;
}

enum FlagOperation {
  FLAG_OPERATION_UNSPECIFIED = 0;
  FLAG_OPERATION_SET = 1;    // Replace flags
  FLAG_OPERATION_ADD = 2;    // Add flags
  FLAG_OPERATION_REMOVE = 3; // Remove flags
}

message SetFlagsResponse {
  uint32 updated_count = 1;
}

// Get Flags
message GetFlagsRequest {
  string account_id = 1;
  string mailbox = 2;
  repeated uint64 uids = 3;
}

message GetFlagsResponse {
  map<uint64, MessageFlags> flags = 1;
}

// Move Message
message MoveMessageRequest {
  string account_id = 1;
  string source_mailbox = 2;
  string target_mailbox = 3;
  repeated uint64 uids = 4;
}

message MoveMessageResponse {
  repeated uint64 new_uids = 1;
}

// Copy Message
message CopyMessageRequest {
  string account_id = 1;
  string source_mailbox = 2;
  string target_mailbox = 3;
  repeated uint64 uids = 4;
}

message CopyMessageResponse {
  repeated uint64 new_uids = 1;
}

// Quota
message GetQuotaRequest {
  string account_id = 1;
}

message GetQuotaResponse {
  Quota quota = 1;
}

// Account Management
message CreateAccountRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  Quota initial_quota = 4;
}

message CreateAccountResponse {
  string account_id = 1;
}

message GetAccountRequest {
  string account_id = 1;
  string email = 2;  // Alternative lookup
}

message GetAccountResponse {
  string account_id = 1;
  string email = 2;
  string display_name = 3;
  int64 created_at = 4;
  bool active = 5;
}

message AuthenticateRequest {
  string email = 1;
  string password = 2;
  string mechanism = 3;  // PLAIN, LOGIN, etc.
}

message AuthenticateResponse {
  bool success = 1;
  string account_id = 2;
  string error = 3;
}

// Mailbox Status (for SELECT/EXAMINE)
message GetMailboxStatusRequest {
  string account_id = 1;
  string mailbox = 2;
}

message GetMailboxStatusResponse {
  Mailbox mailbox = 1;
  uint64 highest_modseq = 2;
}

// Expunge
message ExpungeRequest {
  string account_id = 1;
  string mailbox = 2;
  repeated uint64 uids = 3;  // Empty = all with \Deleted
}

message ExpungeResponse {
  repeated uint64 expunged_uids = 1;
}

// Subscription for IDLE
message SubscribeMailboxRequest {
  string account_id = 1;
  string mailbox = 2;
}

message MailboxEvent {
  MailboxEventType type = 1;
  uint64 uid = 2;
  MessageFlags flags = 3;
  uint32 exists = 4;
  uint32 recent = 5;
}

enum MailboxEventType {
  MAILBOX_EVENT_TYPE_UNSPECIFIED = 0;
  MAILBOX_EVENT_TYPE_NEW_MESSAGE = 1;
  MAILBOX_EVENT_TYPE_FLAGS_CHANGED = 2;
  MAILBOX_EVENT_TYPE_EXPUNGE = 3;
  MAILBOX_EVENT_TYPE_STATUS_UPDATE = 4;
}

// ============================================================================
// Spam Gateway Service
// ============================================================================

service SpamGatewayService {
  rpc ScanMessage(ScanMessageRequest) returns (ScanMessageResponse);
  rpc LearnSpam(LearnRequest) returns (LearnResponse);
  rpc LearnHam(LearnRequest) returns (LearnResponse);
  rpc FuzzyAdd(FuzzyAddRequest) returns (FuzzyAddResponse);
}

message ScanMessageRequest {
  bytes raw_message = 1;
  string sender_ip = 2;
  string helo = 3;
  string mail_from = 4;
  repeated string rcpt_to = 5;
}

message ScanMessageResponse {
  float score = 1;
  SpamAction action = 2;
  repeated SpamSymbol symbols = 3;
  bool is_spam = 4;
  string dkim_result = 5;
  string spf_result = 6;
  string dmarc_result = 7;
}

enum SpamAction {
  SPAM_ACTION_UNSPECIFIED = 0;
  SPAM_ACTION_NO_ACTION = 1;
  SPAM_ACTION_GREYLIST = 2;
  SPAM_ACTION_ADD_HEADER = 3;
  SPAM_ACTION_REWRITE_SUBJECT = 4;
  SPAM_ACTION_SOFT_REJECT = 5;
  SPAM_ACTION_REJECT = 6;
}

message SpamSymbol {
  string name = 1;
  float score = 2;
  string description = 3;
}

message LearnRequest {
  bytes raw_message = 1;
  string account_id = 2;
}

message LearnResponse {
  bool success = 1;
  string message = 2;
}

message FuzzyAddRequest {
  bytes raw_message = 1;
  int32 weight = 2;
  int32 flag = 3;
}

message FuzzyAddResponse {
  bool success = 1;
}

// ============================================================================
// Outbound Queue Service
// ============================================================================

service OutboundQueueService {
  rpc EnqueueMessage(EnqueueMessageRequest) returns (EnqueueMessageResponse);
  rpc GetQueueStatus(GetQueueStatusRequest) returns (GetQueueStatusResponse);
  rpc RetryMessage(RetryMessageRequest) returns (RetryMessageResponse);
  rpc CancelMessage(CancelMessageRequest) returns (CancelMessageResponse);
}

message EnqueueMessageRequest {
  bytes raw_message = 1;
  string sender = 2;
  repeated string recipients = 3;
  string account_id = 4;
  DeliveryPriority priority = 5;
}

enum DeliveryPriority {
  DELIVERY_PRIORITY_UNSPECIFIED = 0;
  DELIVERY_PRIORITY_LOW = 1;
  DELIVERY_PRIORITY_NORMAL = 2;
  DELIVERY_PRIORITY_HIGH = 3;
}

message EnqueueMessageResponse {
  string queue_id = 1;
}

message GetQueueStatusRequest {
  string queue_id = 1;
}

message GetQueueStatusResponse {
  string queue_id = 1;
  QueueStatus status = 2;
  int32 retry_count = 3;
  int64 next_retry = 4;
  string last_error = 5;
  repeated RecipientStatus recipients = 6;
}

enum QueueStatus {
  QUEUE_STATUS_UNSPECIFIED = 0;
  QUEUE_STATUS_PENDING = 1;
  QUEUE_STATUS_SENDING = 2;
  QUEUE_STATUS_SENT = 3;
  QUEUE_STATUS_FAILED = 4;
  QUEUE_STATUS_BOUNCED = 5;
  QUEUE_STATUS_CANCELLED = 6;
}

message RecipientStatus {
  string recipient = 1;
  QueueStatus status = 2;
  string error = 3;
  int64 delivered_at = 4;
}

message RetryMessageRequest {
  string queue_id = 1;
}

message RetryMessageResponse {
  bool success = 1;
}

message CancelMessageRequest {
  string queue_id = 1;
}

message CancelMessageResponse {
  bool success = 1;
}
