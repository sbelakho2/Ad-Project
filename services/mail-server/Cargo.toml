[workspace]
resolver = "2"
members = [
    "crates/mailstore-core",
    "crates/smtp-edge",
    "crates/imap-edge",
    "crates/submission",
    "crates/outbound-queue",
    "crates/mail-proto",
    "crates/mail-common",
    "crates/spam-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ApexMediation Team <dev@apexmediation.ee>"]
license = "MIT"
repository = "https://github.com/apexmediation/mail-server"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# gRPC & Protobuf
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
deadpool-postgres = "0.14"

# Crypto & Security
rustls = { version = "0.23", default-features = false }
tokio-rustls = "0.26"
rcgen = "0.13"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.1"
rsa = "0.9"
base64 = "0.22"
rand = "0.8"

# Email protocols
mail-parser = "0.9"
mail-builder = "0.3"
mail-auth = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utils
zstd = "0.13"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.8"
parking_lot = "0.12"
dashmap = "6.1"
once_cell = "1.20"

# HTTP Client (for Rspamd/Resend)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Test utilities
tempfile = "3"

# Config
config = "0.14"
dotenvy = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
