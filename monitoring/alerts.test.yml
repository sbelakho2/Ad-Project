rule_files:
  - alerts.yml
  - recording-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="apex-api"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ApexApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: apex-api
            exp_annotations:
              summary: apex-api is down
              description: No scrape has succeeded for two minutes.

  - interval: 1m
    input_series:
      - series: 'apex_api_requests_total{status="2xx"}'
        values: '0+600x20'
      - series: 'apex_api_requests_total{status="5xx"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ApexApiServerErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: apex-api 5xx rate above 5 percent
              description: The five-minute server error ratio stayed above 5 percent for ten minutes.

  - interval: 1m
    input_series:
      - series: 'apex_api_requests_total{status="2xx"}'
        values: '0+600x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ApexApiServerErrorRateHigh
        exp_alerts: []
