# Operator stack: prometheus and alertmanager only. Render the alertmanager
# config with the SMTP environment values first (see README.md).
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager.generated.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '127.0.0.1:9093:9093'
