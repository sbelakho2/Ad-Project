# Render this file with the SMTP environment values before starting the stack:
# envsubst < alertmanager.yml > alertmanager.generated.yml
global:
  smtp_smarthost: '${SMTP_HOST}'
  smtp_from: '${ALERT_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: email
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: '${ALERT_EMAIL}'
