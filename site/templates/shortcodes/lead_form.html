<form method="post" action="/free-audit" class="lead-form">
  <div class="field">
    <label for="email">Work email</label>
    <input type="email" id="email" name="email" required autocomplete="email">
    <p class="help">We use this address to arrange your audit.</p>
  </div>
  <div class="field">
    <label for="studio">Publisher or studio</label>
    <input type="text" id="studio" name="studio" required>
  </div>
  <fieldset id="platforms" class="field">
    <legend>Platforms used</legend>
    <div class="choices">
      <label><input type="checkbox" name="platforms" value="max"> MAX</label>
      <label><input type="checkbox" name="platforms" value="levelplay"> LevelPlay</label>
      <label><input type="checkbox" name="platforms" value="admob"> AdMob</label>
    </div>
  </fieldset>
  <div class="field">
    <label for="revenue">Monthly ad revenue (optional)</label>
    <select id="revenue" name="revenue">
      <option value="" selected>Select a range (optional)</option>
      <option value="under-10k">Under $10,000</option>
      <option value="10k-50k">$10,000 to $50,000</option>
      <option value="50k-100k">$50,000 to $100,000</option>
      <option value="100k-300k">$100,000 to $300,000</option>
      <option value="over-300k">Over $300,000</option>
    </select>
  </div>
  <div class="field">
    <label for="notes">Anything we should know? (optional)</label>
    <textarea id="notes" name="notes" rows="5" maxlength="2000"></textarea>
  </div>
  <p class="form-note">Do not include platform credentials.</p>
  <button type="submit" class="button">Request the free audit</button>
  <p class="form-note">We use these details to arrange your audit. Read the <a href="/privacy/">privacy notice</a>.</p>
</form>
