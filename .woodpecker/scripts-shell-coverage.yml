# Shell coverage: every first-party .sh (scripts/, tools/, infrastructure/, sdk/, quality/, .husky/)
# runs under kcov via the bats suite; line coverage gated to the shell floor via the lcov gate.
# Destructive scripts run only in DOGFOOD_DRY_RUN=1 mode (design doc 3.11).
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  shell-coverage:
    image: kcov/kcov:40
    commands:
      - apt-get update && apt-get install -y --no-install-recommends bats
      - mkdir -p "$CI_WORKSPACE/shell-cov"
      - KCOV=$(command -v kcov || echo /kcov)
      - '$KCOV --include-path=scripts,tools,infrastructure,sdk,quality,.husky "$CI_WORKSPACE/shell-cov" bats "$CI_WORKSPACE/quality/shell/tests/shell-invariants.bats"'
  shell-gate:
    image: node:20-bookworm
    depends_on: [shell-coverage]
    commands:
      - FLOOR=$(grep -E '^shell ' tools/coverage/floors.txt | awk '{print $2}')
      - node tools/coverage/lcov-gate.mjs shell-cov/bats/lcov.info $FLOOR
  shell-contract:
    image: node:20-bookworm
    depends_on: [shell-coverage]
    commands:
      - node tools/coverage/yaml-policy-gate.mjs --shell
