# contract coverage: everything that is not line-covered is adversarially
# contracted here, all through the apex-tools binary. Monitoring rules and
# their own tests, terraform, reverse proxies and compose, CI reference
# integrity, pipeline path integrity, the content guard, and the docs
# contracts (links, script references, i18n parity, stylesheet lint).
#
# Note on shell semantics: Woodpecker runs a step's commands as one `set -e`
# script, so a bare `cd` persists across the step; each command below is
# absolute and idempotent for that reason.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  build-apex-tools:
    image: rust:1.87-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo build --release -p apex-tools

  promtool-rules-with-tests:
    image: alpine:3.20
    commands:
      - wget -qO- https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar -C /tmp -xz
      - /tmp/prometheus-2.53.0.linux-amd64/promtool check rules monitoring/alerts.yml monitoring/recording-rules.yml
      - /tmp/prometheus-2.53.0.linux-amd64/promtool test rules monitoring/alerts.test.yml

  terraform-validate:
    image: hashicorp/terraform:1.9
    commands:
      - terraform -chdir=infrastructure/terraform/modules/ai-cost-controls init -backend=false -input=false
      - terraform -chdir=infrastructure/terraform/modules/ai-cost-controls validate

  nginx-caddy-compose-contract:
    image: alpine:3.20
    commands:
      - apk add --no-cache python3 py3-pip curl
      - pip install --break-system-packages gixy==0.1.21
      - gixy infrastructure/nginx/apexmediation.conf
      - gixy infrastructure/nginx/apexmediation.ssl.conf
      - wget -qO /usr/local/bin/caddy "https://caddyserver.com/api/download?os=linux&arch=amd64" && chmod +x /usr/local/bin/caddy
      - caddy validate --config infrastructure/caddy/Caddyfile --adapter caddyfile
      - wget -qO /usr/local/bin/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 && chmod +x /usr/local/bin/docker-compose
      - docker-compose -f docker-compose.yml config -q
      - POSTGRES_PASSWORD=ci-config-only docker-compose -f infrastructure/docker-compose.prod.yml config -q

  contract-checks:
    image: rust:1.87-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract ci-reference-integrity
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract content-guard-adversarial
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract pipeline-paths
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract docs-references
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract samples
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- i18n-parity
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- css-lint
