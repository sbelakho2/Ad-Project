# contract coverage: everything that is not line-covered for the product.
# Monitoring rules and their own tests, the edge config, CI reference
# integrity, pipeline path integrity, the content guard, and the docs
# contracts (links, script references, stylesheet lint).
#
# Note on shell semantics: Woodpecker runs a step's commands as one `set -e`
# script, so each command below is absolute and idempotent.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  build-apex-tools:
    image: rust:1.87-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo build --release -p apex-tools

  promtool-rules-with-tests:
    image: alpine:3.20
    commands:
      - wget -qO- https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar -C /tmp -xz
      - /tmp/prometheus-2.53.0.linux-amd64/promtool check config monitoring/prometheus.yml
      - /tmp/prometheus-2.53.0.linux-amd64/promtool test rules monitoring/alerts.test.yml
      - sed -e 's/${SMTP_HOST}/smtp.ci.invalid/' -e 's/${ALERT_FROM}/alerts@ci.invalid/' -e 's/${SMTP_USER}/ci/' -e 's/${SMTP_PASSWORD}/ci/' -e 's/${ALERT_EMAIL}/ops@ci.invalid/' monitoring/alertmanager.yml > /tmp/alertmanager.ci.yml
      - /tmp/prometheus-2.53.0.linux-amd64/amtool check-config /tmp/alertmanager.ci.yml

  systemd-unit-contract:
    image: debian:bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq systemd
      - systemd-analyze verify infrastructure/systemd/apex-api.service

  caddy-edge-contract:
    image: alpine:3.20
    commands:
      - wget -qO /usr/local/bin/caddy "https://caddyserver.com/api/download?os=linux&arch=amd64" && chmod +x /usr/local/bin/caddy
      - caddy validate --config infrastructure/caddy/Caddyfile --adapter caddyfile

  contract-checks:
    image: rust:1.87-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract ci-reference-integrity
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract content-guard-adversarial
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract pipeline-paths
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract github-metadata
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract docs-references
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- css-lint
