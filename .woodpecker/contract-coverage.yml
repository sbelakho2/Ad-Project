# contract coverage: everything that is not line-covered for the product.
# Monitoring rules and their own tests, the edge config, CI reference
# integrity, pipeline path integrity, the content guard, and the docs
# contracts (links, script references, stylesheet lint).
#
# Note on shell semantics: Woodpecker runs a step's commands as one `set -e`
# script, so each command below is absolute and idempotent.
# Path relevance: the lane reads monitoring rules, the edge and unit config,
# the CI files themselves and the coverage tooling, so it watches those trees.
when:
  - event: [push, pull_request]
    branch: [main, master]
    path:
      - monitoring/**
      - infrastructure/**
      - tools/coverage/**
      - .woodpecker/**
      - Makefile

steps:
  build-apex-tools:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo build --release -p apex-tools

  promtool-rules-with-tests:
    image: alpine:3.20
    commands:
      - wget -qO- https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar -C /tmp -xz
      # amtool ships with the alertmanager release, not the prometheus one.
      - wget -qO- https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz | tar -C /tmp -xz
      - /tmp/prometheus-2.53.0.linux-amd64/promtool check config monitoring/prometheus.yml
      - /tmp/prometheus-2.53.0.linux-amd64/promtool test rules monitoring/alerts.test.yml
      # The substituted smarthost carries the port alertmanager requires.
      - sed -e 's/${SMTP_HOST}/smtp.ci.invalid:587/' -e 's/${ALERT_FROM}/alerts@ci.invalid/' -e 's/${SMTP_USER}/ci/' -e 's/${SMTP_PASSWORD}/ci/' -e 's/${ALERT_EMAIL}/ops@ci.invalid/' monitoring/alertmanager.yml > /tmp/alertmanager.ci.yml
      - /tmp/alertmanager-0.27.0.linux-amd64/amtool check-config /tmp/alertmanager.ci.yml

  systemd-unit-contract:
    image: debian:bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq systemd
      # Stub the ExecStart paths so verify checks unit syntax rather than
      # failing on binaries that are installed at deployment time.
      - touch /usr/local/bin/apex-api /usr/local/bin/apex-control /usr/local/bin/apex-ingest /usr/local/bin/apex-runner /usr/local/bin/apex-sales /usr/local/bin/apex-sales-web /usr/local/bin/apex-sync-push /usr/local/bin/apex-sync-pull /usr/local/bin/apex-watch && chmod +x /usr/local/bin/apex-api /usr/local/bin/apex-control /usr/local/bin/apex-ingest /usr/local/bin/apex-runner /usr/local/bin/apex-sales /usr/local/bin/apex-sales-web /usr/local/bin/apex-sync-push /usr/local/bin/apex-sync-pull /usr/local/bin/apex-watch
      - systemd-analyze verify infrastructure/systemd/apex-api.service infrastructure/systemd/apex-control.service infrastructure/systemd/apex-ingest.service infrastructure/systemd/apex-ingest.timer infrastructure/systemd/apex-runner-audit.service infrastructure/systemd/apex-runner-audit.timer infrastructure/systemd/apex-runner-cycle.service infrastructure/systemd/apex-runner-cycle.timer infrastructure/systemd/apex-runner-daily.service infrastructure/systemd/apex-runner-daily.timer infrastructure/systemd/apex-runner-monthly.service infrastructure/systemd/apex-runner-monthly.timer infrastructure/systemd/apex-sales-run.service infrastructure/systemd/apex-sales-run.timer infrastructure/systemd/apex-sales-discover.service infrastructure/systemd/apex-sales-discover.timer infrastructure/systemd/apex-sales-web.service infrastructure/systemd/apex-watch.service infrastructure/systemd/apex-watch.timer infrastructure/systemd/apex-watch-bill.service infrastructure/systemd/apex-watch-bill.timer infrastructure/systemd/apex-sync-push.service infrastructure/systemd/apex-sync-push.timer infrastructure/systemd/apex-sync-pull.service infrastructure/systemd/apex-sync-pull.timer

  caddy-edge-contract:
    image: alpine:3.20
    commands:
      # Pinned release tarball: the unversioned caddyserver.com download
      # endpoint answers with a contact page instead of a binary.
      - wget -qO /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz && tar -C /tmp -xzf /tmp/caddy.tar.gz caddy && mv /tmp/caddy /usr/local/bin/caddy && chmod +x /usr/local/bin/caddy
      - apk add --no-cache python3
      - APEX_ACCESS_LOG=/tmp/apex-access.json caddy validate --config infrastructure/caddy/Caddyfile --adapter caddyfile
      - sh infrastructure/caddy/tests/contract.sh

  contract-checks:
    image: rust:1.88-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract ci-reference-integrity
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract content-guard-adversarial
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract pipeline-paths
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract github-metadata
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- contract docs-references
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- css-lint
