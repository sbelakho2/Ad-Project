# Diff-scoped fast gate: on a pull request, run tests and clippy only for the
# Rust crates the diff touches (plus reverse-dependency dependents) and only
# the non-Rust gates whose inputs changed. The full lanes still run on push;
# this lane exists to catch regressions quickly without recompiling the world.
when:
  - event: [pull_request]
    branch: [main, master]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  changed:
    image: rust:1.88-bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends python3 git
      - cd "$CI_WORKSPACE" && python3 tools/ci/changed.py --base "${CI_COMMIT_BEFORE_SHA:-origin/main}" --test --clippy
