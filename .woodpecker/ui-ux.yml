# ui-ux: structural WCAG audit of the rendered console pages, all-Rust.
# apex-api renders its console pages from checked-in fixtures, then apex-tools
# runs the structural WCAG checks on that output.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  render-console-pages:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-api --bin render-fixtures -- crates/apex-api/fixtures target/ui-fixtures

  console-a11y:
    image: rust:1.87-bookworm
    depends_on: [render-console-pages]
    commands:
      - cd rust && cargo build --release -p apex-tools
      - rust/target/release/apex-tools console-a11y target/ui-fixtures
