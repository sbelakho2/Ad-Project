# Backend (TS) coverage gate: jest 100% over src+routes+services+scripts,
# plus the SQL migration contract (apply/up/down round-trip, checksum tamper).
# Mirrors the env matrix of .github/workflows/ci-all.yml job "backend".
# NOTE: backend has no package-lock.json, so deps come from the root workspace install.
when:
  - event: [push, pull_request]
    branch: [main, master]

environment:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apexmediation_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apexmediation_test
  REDIS_URL: redis://redis:6379
  JWT_SECRET: test-access-secret
  JWT_REFRESH_SECRET: test-refresh-secret
  NODE_ENV: test
  FORCE_DB_SETUP: 'true'
  RUN_MIGRATIONS_IN_TEST: 'true'
  SKIP_DB_SETUP: 'false'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apexmediation_test
  redis:
    image: redis:7-alpine

steps:
  wait-services:
    image: postgres:16-alpine
    commands:
      - |
        for i in $(seq 1 60); do
          if pg_isready -h postgres -U postgres -d apexmediation_test; then break; fi
          sleep 1
        done
        pg_isready -h postgres -U postgres -d apexmediation_test

  install:
    image: node:20-bookworm
    commands:
      - npm ci --no-audit --no-fund

  coverage-jest-100:
    image: node:20-bookworm
    depends_on: [install]
    commands:
      - cd backend && npx jest -c jest.coverage.config.cjs --runInBand

  sql-migration-contract:
    image: node:20-bookworm
    depends_on: [coverage-jest-100]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apexmediation_contract
      ALLOW_MIGRATION_DOWN: '1'
    commands:
      - cd backend
      - node scripts/runMigrationsV2.js
      - node scripts/runMigrationsV2.js --down
      - node scripts/runMigrationsV2.js
      - node scripts/verifyMigrations.js

  gate:
    image: node:20-bookworm
    depends_on: [coverage-jest-100]
    commands:
      - node tools/coverage/coverage-gate.mjs --domain backend --artifact backend/coverage/coverage-summary.json --tool jest
