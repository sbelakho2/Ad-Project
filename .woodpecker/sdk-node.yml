# sdk-node: the JavaScript SDK surfaces. Web and react-native run their jest
# suites, lint, type checks and builds, then the lcov gate against the floor
# from tools/coverage/floors.txt. Every command is absolute and idempotent
# because a step's commands run as one `set -e` shell script.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  web-sdk:
    image: node:20-bookworm-slim
    commands:
      - cd "$CI_WORKSPACE"/sdk/web && npm ci
      - cd "$CI_WORKSPACE"/sdk/web && npm test -- --coverage --coverageReporters=lcov
      - cd "$CI_WORKSPACE"/sdk/web && npm run lint
      - cd "$CI_WORKSPACE"/sdk/web && npm run build
      - cd "$CI_WORKSPACE" && cargo build --release --manifest-path rust/Cargo.toml -p apex-tools
      - cd "$CI_WORKSPACE" && FLOOR=$(grep -E "^web-sdk " tools/coverage/floors.txt | awk '{print $2}') && rust/target/release/apex-tools lcov-gate sdk/web/coverage/lcov.info "$FLOOR"

  react-native-sdk:
    image: node:20-bookworm-slim
    commands:
      - cd "$CI_WORKSPACE"/sdk/react-native && npm ci
      - cd "$CI_WORKSPACE"/sdk/react-native && npx jest --config jest.coverage.config.cjs --coverage
      - cd "$CI_WORKSPACE"/sdk/react-native && npx tsc --noEmit
      - cd "$CI_WORKSPACE"/sdk/react-native && npx eslint "src/**/*.{ts,tsx}"
      - cd "$CI_WORKSPACE"/sdk/react-native && npx bob build
      - cd "$CI_WORKSPACE" && cargo build --release --manifest-path rust/Cargo.toml -p apex-tools
      - cd "$CI_WORKSPACE" && FLOOR=$(grep -E "^react-native-sdk " tools/coverage/floors.txt | awk '{print $2}') && rust/target/release/apex-tools lcov-gate sdk/react-native/coverage/lcov.info "$FLOOR"
