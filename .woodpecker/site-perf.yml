# site-perf: the marketing site's hard performance budgets, all-Rust.
# Zola builds the dist; apex-tools then runs the claims contract, the byte
# budgets, and the structural WCAG checks on the built output.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  site-build:
    image: ghcr.io/getzola/zola:v0.19.2
    commands:
      - cd site
      - zola build

  site-gates:
    image: rust:1.87-bookworm
    depends_on: [site-build]
    commands:
      - cd rust && cargo build --release -p apex-tools
      - cd "$CI_WORKSPACE"
      - rust/target/release/apex-tools claims
      - rust/target/release/apex-tools perf-budget --dist site/public --min-pages 6
      - rust/target/release/apex-tools console-a11y site/public
