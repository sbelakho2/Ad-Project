# Go coverage gates: backend/auction, backend/config, backend/payments, backend/router,
# and quality (integration harness itself must be covered too).
# Every function must report 100.0% and the total must be 100.0%.
when:
  - event: [push, pull_request]
    branch: [main, master]

matrix:
  include:
    - MODULE: backend/auction
    - MODULE: backend/config
    - MODULE: backend/payments
    - MODULE: backend/router
    - MODULE: quality

steps:
  go-coverage-100:
    image: golang:1.21-bookworm
    commands:
      - cd "$CI_WORKSPACE/$MODULE"
      - go test -race -covermode=atomic -coverprofile=cover.out ./...
      - go tool cover -func=cover.out > cover.func
      - "$CI_WORKSPACE/tools/coverage/go-coverage-gate.sh \"$CI_WORKSPACE/$MODULE/cover.func\" 100"
