# sdk-android: Kotlin SDK coverage and the sample apps. The kover floor comes
# from tools/coverage/floors.txt and applies to both the line and branch
# bounds; debug unit tests are the measured variant. Samples only build.
# Commands are absolute and idempotent because a step's commands run as one
# `set -e` shell script.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  android-core:
    image: ghcr.io/cirruslabs/android-sdk:34
    commands:
      - cd "$CI_WORKSPACE" && FLOOR=$(grep -E "^android-core " tools/coverage/floors.txt | awk '{print $2}')
      - cd "$CI_WORKSPACE"/sdk/core/android && bash ./gradlew.sh testDebugUnitTest koverXmlReportDebug koverVerifyDebug -PkoverFloor="${FLOOR}" --console=plain

  android-ctv:
    image: ghcr.io/cirruslabs/android-sdk:34
    commands:
      - cd "$CI_WORKSPACE" && FLOOR=$(grep -E "^android-ctv " tools/coverage/floors.txt | awk '{print $2}')
      - cd "$CI_WORKSPACE"/sdk/ctv/android-tv && GRADLE_PROJECT_DIR=. bash ../../core/android/gradlew.sh testDebugUnitTest koverXmlReportDebug koverVerifyDebug -PkoverFloor="${FLOOR}" --console=plain

  android-samples:
    image: ghcr.io/cirruslabs/android-sdk:34
    commands:
      - cd "$CI_WORKSPACE"/sdk/samples/android/ApexSandboxAndroid && GRADLE_PROJECT_DIR=. bash ../../../core/android/gradlew.sh :app:assembleDebug --console=plain
      - cd "$CI_WORKSPACE"/sdk/samples/android/ApexSandboxAndroidTV && GRADLE_PROJECT_DIR=. bash ../../../core/android/gradlew.sh :tvapp:assembleDebug --console=plain
