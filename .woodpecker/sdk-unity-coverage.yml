# Unity (C#) coverage, two tiers.
# Tier 1 (this pipeline, no Unity license): the net8 xunit project is forced into
# real execution via UNITY_RUNNER=true (defeats the csproj self-skip); coverlet
# enforces 100% on line/branch/method for all editor-independent code.
# Tier 2 (licensed Unity runner, phase 2): Unity Test Framework coverage with
# assemblyFilters:+ApexMediation for UnityEngine-coupled bridges (see design doc 3.7).
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  unity-tier1-dotnet-100:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    environment:
      UNITY_RUNNER: 'true'
    commands:
      - cd sdk/core/unity
      - dotnet restore ApexMediation.Tests.csproj
      - dotnet test ApexMediation.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=./coverage/lcov.info /p:Threshold=100 /p:ThresholdType=line,branch,method /p:ThresholdStat=total
  unity-tier1-gate:
    image: node:20-bookworm
    depends_on: [unity-tier1-dotnet-100]
    commands:
      - node tools/coverage/coverage-gate.mjs --domain unity-tier1 --artifact sdk/core/unity/coverage/lcov.info --tool lcov
