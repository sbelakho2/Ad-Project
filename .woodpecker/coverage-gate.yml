# Aggregate verdict. Runs when every lane above has finished; fails the build
# unless all domain floors are met, the manifest is complete, and the ratchet
# holds. This is the protected-branch status context.
when:
  - event: [push, pull_request]
    branch: [main, master]

depends_on:
  - apex-rs-coverage
  - dogfood-audit
  - contract-coverage
  - site-perf
  - ui-ux

steps:
  build-apex-tools:
    image: rust:1.87-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo build --release -p apex-tools

  aggregate-verdict:
    image: rust:1.87-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- aggregate-verdict --report coverage-report.md
