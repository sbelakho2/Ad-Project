# Aggregate verdict. Runs only when every coverage pipeline above has finished;
# fails the build unless all domain floors (tools/coverage/coverage-floor.json) are met
# and the manifest is complete. This is the protected-branch status context.
when:
  - event: [push, pull_request]
    branch: [main, master]

depends_on:
  - backend-coverage
  - frontend-coverage
  - node-services-coverage
  - go-coverage
  - sdk-android-coverage
  - sdk-apple-coverage
  - sdk-unity-coverage
  - sdk-flutter-coverage
  - python-coverage
  - rust-coverage
  - scripts-shell-coverage
  - contract-coverage
  - dogfood-audit

steps:
  aggregate-coverage-verdict:
    image: node:20-bookworm
    commands:
      - node tools/coverage/aggregate-coverage-verdict.mjs --report coverage-report.md
