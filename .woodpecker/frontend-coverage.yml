# Frontend coverage gates: console (Next.js), website (Next.js), control-plane (Express).
# All three get jest 100% via additive jest.coverage.config.* files.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  console-install:
    image: node:20-bookworm
    commands:
      - cd console && npm ci --no-audit --no-fund

  console-coverage-100:
    image: node:20-bookworm
    depends_on: [console-install]
    commands:
      - cd console && npx jest -c jest.coverage.config.js --runInBand

  console-gate:
    image: node:20-bookworm
    depends_on: [console-coverage-100]
    commands:
      - node tools/coverage/coverage-gate.mjs --domain console --artifact console/coverage/coverage-summary.json --tool jest

  website-install:
    image: node:20-bookworm
    commands:
      - cd website && npm ci --no-audit --no-fund

  website-coverage-100:
    image: node:20-bookworm
    depends_on: [website-install]
    commands:
      - cd website && npx jest -c jest.coverage.config.cjs --runInBand

  website-gate:
    image: node:20-bookworm
    depends_on: [website-coverage-100]
    commands:
      - node tools/coverage/coverage-gate.mjs --domain website --artifact website/coverage/coverage-summary.json --tool jest

  control-plane-install:
    image: node:20-bookworm
    commands:
      - cd control-plane && npm ci --no-audit --no-fund

  control-plane-coverage-100:
    image: node:20-bookworm
    depends_on: [control-plane-install]
    commands:
      - cd control-plane && npx jest -c jest.coverage.config.js --runInBand

  control-plane-gate:
    image: node:20-bookworm
    depends_on: [control-plane-coverage-100]
    commands:
      - node tools/coverage/coverage-gate.mjs --domain control-plane --artifact control-plane/coverage/coverage-summary.json --tool jest
