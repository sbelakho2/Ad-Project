# dogfood audit: the repository's own quality machinery, all-Rust.
# Every gate is a subcommand of the apex-tools binary.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  build-apex-tools:
    image: rust:1.87-bookworm
    commands:
      - rustup component add clippy rustfmt
      - cd rust && cargo build --release -p apex-tools

  manifest:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- manifest --out coverage-manifest.json

  walker-parity:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- walker-parity --manifest coverage-manifest.json

  orphan-gate:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- orphan-gate --manifest coverage-manifest.json

  floor-ratchet-and-sync:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- floor-ratchet
      - cd rust && cargo run --release -q -p apex-tools -- floors-sync

  assertion-presence:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- assertion-presence

  stub-ban:
    image: rust:1.87-bookworm
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- stub-ban

  mutation-smoke-and-floor:
    image: rust:1.87-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- mutation-smoke
      - cd rust && cargo run --release -q -p apex-tools -- mutation-floor

  docs-lint:
    image: rust:1.87-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd rust && cargo run --release -q -p apex-tools -- docs-lint --source --baseline tools/coverage/docs-links-baseline.txt
