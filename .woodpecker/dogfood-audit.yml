# dogfood audit: the repository's own quality machinery, all-Rust.
# Every gate is a subcommand of the apex-tools binary: manifest completeness,
# walker parity, orphan ceiling, floor ratchet and sync, assertion presence,
# stub ban, mutation smoke and floor, the policy bans, the docs linkcheck, and
# the prose ratchet.
#
# Note on shell semantics: Woodpecker runs a step's commands as one `set -e`
# script, so a bare `cd` persists and a second `cd rust` would fail. Every
# command below is absolute and idempotent for that reason.
# Path relevance: every gate here reads the Rust tree, the coverage tooling,
# the dogfood catalog, the manifest or the Makefile, so the lane watches them.
when:
  - event: [push, pull_request]
    branch: [main, master]
    path:
      - rust/**
      - tools/coverage/**
      - tools/dogfood/**
      - coverage-manifest.json
      - Makefile

steps:
  build-apex-tools:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo build --release -p apex-tools

  manifest:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- manifest --out coverage-manifest.json

  walker-parity:
    image: rust:1.88-bookworm
    depends_on: [manifest]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- walker-parity --manifest coverage-manifest.json

  orphan-gate:
    image: rust:1.88-bookworm
    depends_on: [manifest]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- orphan-gate --manifest coverage-manifest.json

  floor-ratchet-and-sync:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- floor-ratchet
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- floors-sync

  assertion-presence:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- assertion-presence

  stub-ban:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- stub-ban

  policy-gates:
    image: rust:1.88-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- yaml-policy --full

  mutation-smoke-and-floor:
    image: rust:1.88-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- mutation-smoke
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- mutation-floor

  docs-links:
    image: rust:1.88-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- docs-links --baseline tools/coverage/docs-links-baseline.txt

  docs-lint:
    image: rust:1.88-bookworm
    depends_on: [build-apex-tools]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- docs-lint --source --baseline tools/coverage/docs-lint-baseline.txt
