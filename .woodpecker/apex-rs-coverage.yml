# apex-rs coverage: every Rust crate in the all-Rust repository, one job per
# crate. Real per-crate floors from tools/coverage/floors.txt; coverage via
# cargo-llvm-cov with a real lcov artifact consumed by apex-tools' lcov gate
# (no --fail-under shortcuts). Clippy and fmt run per crate too.
when:
  - event: [push, pull_request]
    branch: [main, master]

matrix:
  include:
    - CRATE: apex-core
    - CRATE: apex-connectors
    - CRATE: apex-audit
    - CRATE: apex-proof
    - CRATE: apex-autopilot
    - CRATE: apex-billing
    - CRATE: apex-api
    - CRATE: apex-tools
    - CRATE: mail-server
      DIR: services/mail-server

steps:
  apex-rs-crate:
    image: rust:1.87-bookworm
    commands:
      - rustup component add llvm-tools-preview clippy rustfmt
      - cargo install cargo-llvm-cov --locked
      - if [ -z "${DIR:-}" ]; then cd rust/crates; else cd rust/${DIR}; fi
      - cargo llvm-cov -p "$CRATE" --lcov --output-path "$CRATE.lcov"
      - cargo test -p "$CRATE"
      - cargo clippy -p "$CRATE" --all-targets -- -D warnings
      - cargo fmt -p "$CRATE" --check
      - FLOOR=$(grep -E "^${CRATE} " "$CI_WORKSPACE/tools/coverage/floors.txt" | awk '{print $2}')
      - cd "$CI_WORKSPACE/rust/target/release"
      - /w/rust/target/release/apex-tools lcov-gate "/w/rust/$CRATE.lcov" "$FLOOR"
