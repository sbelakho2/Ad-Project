# apex-rs coverage: one matrix entry per Rust crate for the build domain
# (tests, clippy, fmt). Coverage is produced by ONE workspace-instrumented
# llvm-cov run (all crates' tests in one profile), because the frozen floors
# in tools/coverage/floors.txt were calibrated that way: per-crate
# `cargo llvm-cov -p <crate>` runs miss hits from other crates' tests and can
# gate below a floor the workspace run clears. The workspace run and all 18
# gates execute once, in the apex-core matrix entry; the other entries build
# their crate. Each gate reads the merged profile and `lcov-gate --crate`
# filters it to that crate's records.
# Stable cargo-llvm-cov emits no branch records, so the gate holds lines and
# functions; branch parity stays a nightly-toolchain upgrade.
#
# Note on shell semantics: Woodpecker runs a step's commands as one `set -e`
# script, so every `cd` below is absolute and idempotent.
# Path relevance: the lane watches the Rust workspace only, so an unrelated
# change no longer spends 18 matrix entries on a workspace that did not move.
when:
  - event: [push, pull_request]
    branch: [main, master]
    path:
      - rust/**

matrix:
  include:
    - CRATE: apex-core
      PKG: apex-core
    - CRATE: apex-connectors
      PKG: apex-connectors
    - CRATE: apex-audit
      PKG: apex-audit
    - CRATE: apex-proof
      PKG: apex-proof
    - CRATE: apex-autopilot
      PKG: apex-autopilot
    - CRATE: apex-billing
      PKG: apex-billing
    - CRATE: apex-api
      PKG: apex-api
    - CRATE: apex-vault
      PKG: apex-vault
    - CRATE: apex-tools
      PKG: apex-tools
    - CRATE: apex-lift
      PKG: apex-lift
    - CRATE: apex-ui
      PKG: apex-ui
    - CRATE: apex-analytics
      PKG: apex-analytics
    - CRATE: apex-metrics
      PKG: apex-metrics
    - CRATE: apex-notify
      PKG: apex-notify
    - CRATE: apex-control
      PKG: apex-control
    - CRATE: apex-sales
      PKG: apex-sales
    - CRATE: apex-sales-web
      PKG: apex-sales-web
    - CRATE: apex-watch
      PKG: apex-watch

steps:
  apex-rs-crate:
    image: rust:1.88-bookworm
    commands:
      - rustup component add llvm-tools-preview clippy rustfmt
      - cargo install cargo-llvm-cov --version 0.9.1 --locked
      - cd "$CI_WORKSPACE"/rust
      - cargo test -p "$PKG" && cargo clippy -p "$PKG" --all-targets -- -D warnings && cargo fmt -p "$PKG" --check
      - if [ "$CRATE" = apex-core ]; then
      -   mkdir -p target/coverage
      -   cargo llvm-cov --workspace --lcov --output-path target/coverage/workspace.lcov
      -   cargo build --release -p apex-tools
      -   while read -r DOMAIN FLOOR; do
      -     case "$DOMAIN" in ''|'#'*) continue ;; esac
      -     target/release/apex-tools lcov-gate target/coverage/workspace.lcov "$FLOOR" --crate "$DOMAIN"
      -   done < "$CI_WORKSPACE"/tools/coverage/floors.txt
      - fi
