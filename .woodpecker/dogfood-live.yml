# dogfood-live: the live half of the adversarial dogfooding system.
#
# Statically, `apex-tools dogfood-plan` proves that the catalog
# (tools/dogfood/surfaces.json) is complete against the registered routes and
# fixture page lists. This lane adds the part that only a real boot can prove:
# the three services run against a real ClickHouse while every required probe
# cell (contract census, no-inline, assets, auth authority, hostile corpus,
# CSRF/idempotency, traversal, escaping, concurrency, failure injection and
# differential truth) has to pass, and the ratchet baseline
# (tools/dogfood/live-baseline.json) has to match.
#
# The clickhouse service below is an external, unowned store for the harness:
# it is deliberately NOT passed --clickhouse-owned, so the ClickHouse
# severance subprobe records a reasoned skip instead of managing the
# container. The lane still requires the store to answer (the harness fails
# the run when --clickhouse-url is unreachable); the wait loop before the
# CH-dependent steps makes a slow container start a wait instead of a flake.
#
# Note on shell semantics: Woodpecker runs a step's commands as one `set -e`
# script, so each command below is absolute and idempotent.
when:
  - event: [push, pull_request]
    branch: [main, master]

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 24

steps:
  build:
    image: rust:1.88-bookworm
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo build -p apex-api -p apex-control -p apex-sales-web -p apex-sales -p apex-analytics -p apex-autopilot -p apex-watch -p apex-tools

  dogfood-plan:
    image: rust:1.88-bookworm
    depends_on: [build]
    commands:
      - cd "$CI_WORKSPACE"/rust && cargo run --release -q -p apex-tools -- dogfood-plan

  live-rust-suites:
    image: rust:1.88-bookworm
    depends_on: [build]
    commands:
      # The gated suites read APEX_CLICKHOUSE_HTTP/APEX_CLICKHOUSE_DB; the wait
      # loop turns a slowly starting service container into a bounded wait.
      - for i in $(seq 1 45); do (echo > /dev/tcp/clickhouse/8123) 2>/dev/null && break; sleep 2; done; (echo > /dev/tcp/clickhouse/8123) 2>/dev/null
      - cd "$CI_WORKSPACE"/rust && APEX_CLICKHOUSE_HTTP=http://clickhouse:8123 APEX_CLICKHOUSE_DB=apex_live_ci cargo test -p apex-analytics -p apex-api -- --nocapture

  run-harness:
    image: rust:1.88-bookworm
    depends_on: [build, dogfood-plan]
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
      - for i in $(seq 1 45); do (echo > /dev/tcp/clickhouse/8123) 2>/dev/null && break; sleep 2; done; (echo > /dev/tcp/clickhouse/8123) 2>/dev/null
      - cd "$CI_WORKSPACE" && python3 tools/dogfood/live.py --bin-dir rust/target/debug --clickhouse-url http://clickhouse:8123
