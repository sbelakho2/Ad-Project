# Rust coverage: services/mail-server (8 crates) via cargo-llvm-cov.
# Lines enforced at 100 by --fail-under-lines; branch parity enforced by the lcov gate
# (BRH==BRF for every first-party source record; proto-generated code is GENERATED-excluded).
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  rust-coverage-100:
    image: rust:1.83-bookworm
    commands:
      - cargo install cargo-llvm-cov --locked
      - cd services/mail-server
      - cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 100
  rust-branch-gate:
    image: node:20-bookworm
    depends_on: [rust-coverage-100]
    commands:
      - node tools/coverage/lcov-gate.mjs services/mail-server/lcov.info 100 --require-branches
