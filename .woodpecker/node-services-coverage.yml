# Node services & libs: edge-worker, services/autopilot, sdk/web, sdk/react-native,
# and root-level JS tooling (tools/, quality JS, scripts JS, console scripts) via c8+node:test.
# Floors are enforced by tools/coverage/coverage-gate.mjs from coverage-floor.json (ratchet-only).
# NOTE: each step is self-contained; the working directory persists across the commands of one
# step only, so every command cd's explicitly from $CI_WORKSPACE.
when:
  - event: [push, pull_request]
    branch: [main, master]

steps:
  edge-worker:
    image: node:20-bookworm
    commands:
      - cd "$CI_WORKSPACE/edge-worker" && npm ci --no-audit --no-fund
      - cd "$CI_WORKSPACE/edge-worker" && npx jest -c jest.coverage.config.cjs --runInBand
      - cd "$CI_WORKSPACE" && node tools/coverage/coverage-gate.mjs --domain edge-worker --artifact edge-worker/coverage/coverage-summary.json --tool jest

  autopilot:
    image: node:20-bookworm
    commands:
      - cd "$CI_WORKSPACE/services/autopilot" && npm ci --no-audit --no-fund
      - cd "$CI_WORKSPACE/services/autopilot" && npx jest -c jest.coverage.config.js --runInBand
      - cd "$CI_WORKSPACE" && node tools/coverage/coverage-gate.mjs --domain autopilot --artifact services/autopilot/coverage/coverage-summary.json --tool jest

  web-sdk:
    image: node:20-bookworm
    commands:
      - cd "$CI_WORKSPACE/sdk/web" && npm ci --no-audit --no-fund
      - cd "$CI_WORKSPACE/sdk/web" && npx jest -c jest.coverage.config.cjs --runInBand
      - cd "$CI_WORKSPACE" && node tools/coverage/coverage-gate.mjs --domain web-sdk --artifact sdk/web/coverage/coverage-summary.json --tool jest

  react-native-sdk:
    image: node:20-bookworm
    commands:
      - cd "$CI_WORKSPACE/sdk/react-native" && npm install --no-audit --no-fund
      - cd "$CI_WORKSPACE/sdk/react-native" && npx jest -c jest.coverage.config.cjs --runInBand
      - cd "$CI_WORKSPACE" && node tools/coverage/coverage-gate.mjs --domain react-native-sdk --artifact sdk/react-native/coverage/coverage-summary.json --tool jest

  js-tools:
    image: node:20-bookworm
    commands:
      - cd "$CI_WORKSPACE/tools" && npm install --no-audit --no-fund
      - cd "$CI_WORKSPACE/tools" && npm run test:cov
      - cd "$CI_WORKSPACE" && node tools/coverage/coverage-gate.mjs --domain js-tools --artifact tools/coverage/coverage/coverage-summary.json --tool c8
