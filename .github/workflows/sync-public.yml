name: Sync Public Repo

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the public repo'
        required: true
        default: 'chore: sync from private repo'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          path: private-repo

      - name: Checkout Public Repo
        uses: actions/checkout@v4
        with:
          repository: sbelakho2/apex-mediation-platform
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Sync Files
        run: |
          # Clean public repo (exclude .git)
          cd public-repo
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +
          cd ..

          # Copy SDKs
          mkdir -p public-repo/sdk
          cp -r private-repo/sdk/* public-repo/sdk/
          # Remove any internal build artifacts if they exist
          find public-repo/sdk -name ".build" -type d -exec rm -rf {} +
          find public-repo/sdk -name "build" -type d -exec rm -rf {} +

          # Copy Documentation
          mkdir -p public-repo/docs
          cp -r private-repo/docs/Customer-Facing/* public-repo/docs/

          # Copy Examples
          mkdir -p public-repo/examples
          cp -r private-repo/"Test Apps"/* public-repo/examples/

          # Copy Meta Files
          cp private-repo/CHANGELOG.md public-repo/
          cp private-repo/docs/Public/README.md public-repo/

      - name: Commit and Push
        working-directory: public-repo
        run: |
          git config user.name "Apex Automation"
          git config user.email "automation@apexmediation.ee"
          
          # Check if there are changes
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push origin main
          else
            echo "No changes to sync."
          fi
