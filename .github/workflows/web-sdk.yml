name: Web SDK CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sdk/web/**'
      - '.github/workflows/web-sdk.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sdk/web/**'
      - '.github/workflows/web-sdk.yml'

jobs:
  web-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: |
          npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Generate Typedoc
        run: npm run docs

      - name: Generate mock success trace artifact
        run: npm run gen:mock-trace

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-sdk-dist
          path: sdk/web/dist
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-sdk-coverage
          path: sdk/web/coverage
          if-no-files-found: error

      - name: Upload mock trace
        uses: actions/upload-artifact@v4
        with:
          name: web-sdk-mock-trace
          path: sdk/web/artifacts/mock-success-trace.json
          if-no-files-found: error

      - name: Upload typedoc site
        uses: actions/upload-artifact@v4
        with:
          name: web-sdk-typedoc
          path: sdk/web/typedoc
          if-no-files-found: error
