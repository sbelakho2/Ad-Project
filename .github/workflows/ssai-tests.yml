# SSAI E2E Test Suite GitHub Actions Workflow
#
# Runs all SSAI tests including:
# - 8 protocol/container variant tests
# - Chaos/fault injection tests
# - DRM compatibility tests
# - Quick soak tests (CI)
# - Nightly extended soak tests

name: SSAI E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/src/services/ssai/**'
      - 'sdk/web/src/ssai/**'
      - 'sdk/ctv/**'
      - 'backend/tests/ssai/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/services/ssai/**'
      - 'sdk/web/src/ssai/**'
      - 'sdk/ctv/**'
      - 'backend/tests/ssai/**'
  schedule:
    # Nightly soak tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - variants
          - chaos
          - drm
          - soak-quick
          - soak-6hour
          - soak-12hour

env:
  NODE_VERSION: '20'
  CI: true

jobs:
  # ============================================
  # Variant Tests - All 8 protocol/container combinations
  # ============================================
  variant-tests:
    name: Variant Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.inputs.test_type == 'variants' || github.event.inputs.test_type == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - hls-live-ts
          - hls-live-cmaf
          - hls-vod-ts
          - hls-vod-cmaf
          - dash-live-ts
          - dash-live-cmaf
          - dash-vod-ts
          - dash-vod-cmaf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run variant test
        run: |
          cd backend
          npm test -- --testPathPattern="variants/${{ matrix.variant }}" --verbose
        env:
          SSAI_TEST_VARIANT: ${{ matrix.variant }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-results-${{ matrix.variant }}
          path: backend/test-results/

  # ============================================
  # Chaos/Fault Injection Tests
  # ============================================
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.inputs.test_type == 'chaos' || github.event.inputs.test_type == 'all' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run chaos tests
        run: |
          cd backend
          npm test -- --testPathPattern="chaos" --verbose --runInBand
        env:
          SSAI_CHAOS_ENABLED: true

      - name: Upload chaos test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: backend/test-results/

  # ============================================
  # DRM Compatibility Tests
  # ============================================
  drm-tests:
    name: DRM Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.inputs.test_type == 'drm' || github.event.inputs.test_type == 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run DRM tests
        run: |
          cd backend
          npm test -- --testPathPattern="drm" --verbose

      - name: Upload DRM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drm-results
          path: backend/test-results/

  # ============================================
  # Quick Soak Test (CI - 5 minutes)
  # ============================================
  soak-quick:
    name: Quick Soak Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.inputs.test_type == 'soak-quick' || github.event.inputs.test_type == 'all' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run quick soak test
        run: |
          cd backend
          npm test -- --testPathPattern="soak" --verbose --runInBand
        env:
          SSAI_SOAK_CONFIG: quick

      - name: Upload soak test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-quick-results
          path: backend/test-results/

  # ============================================
  # Backend Unit Tests (Tracking & Operability)
  # ============================================
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tracking tests
        run: |
          cd backend
          npm test -- --testPathPattern="tracking/tracking.test" --verbose

      - name: Run operability tests
        run: |
          cd backend
          npm test -- --testPathPattern="operability/operability.test" --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: backend/test-results/

  # ============================================
  # Web SDK Tests
  # ============================================
  web-sdk-tests:
    name: Web SDK Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/web/package-lock.json

      - name: Install dependencies
        run: |
          cd sdk/web
          npm ci

      - name: Run SSAI tests
        run: |
          cd sdk/web
          npm test -- --testPathPattern="ssai" --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-sdk-results
          path: sdk/web/coverage/

  # ============================================
  # Nightly 6-Hour Soak Test
  # ============================================
  soak-6hour:
    name: 6-Hour Soak Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.test_type == 'soak-6hour' }}
    timeout-minutes: 400 # 6h 40m

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run 6-hour soak test
        run: |
          cd backend
          npx ts-node tests/ssai/e2e/soak/soak.test.ts 6hour
        env:
          SSAI_SOAK_CONFIG: 6hour

      - name: Upload soak test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-6hour-results
          path: backend/test-results/
          retention-days: 30

  # ============================================
  # Weekly 12-Hour Soak Test (Saturday nights)
  # ============================================
  soak-12hour:
    name: 12-Hour Soak Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'soak-12hour' }}
    timeout-minutes: 780 # 13 hours

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run 12-hour soak test
        run: |
          cd backend
          npx ts-node tests/ssai/e2e/soak/soak.test.ts 12hour
        env:
          SSAI_SOAK_CONFIG: 12hour

      - name: Upload soak test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-12hour-results
          path: backend/test-results/
          retention-days: 90

  # ============================================
  # Piercing E2E Tests - All 6 Categories
  # ============================================
  piercing-tests:
    name: Piercing E2E Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.inputs.test_type == 'all' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run Session & Manifest Piercing Tests
        run: |
          cd backend
          npm test -- --testPathPattern="piercing/session-manifest" --verbose

      - name: Run Signaling & Pod Planning Piercing Tests
        run: |
          cd backend
          npm test -- --testPathPattern="piercing/signaling-pod-planning" --verbose

      - name: Run Pod Decisioning Piercing Tests
        run: |
          cd backend
          npm test -- --testPathPattern="piercing/pod-decisioning" --verbose

      - name: Run Stitching & Packaging Piercing Tests
        run: |
          cd backend
          npm test -- --testPathPattern="piercing/stitching-packaging" --verbose

      - name: Run Tracking & Reconciliation Piercing Tests
        run: |
          cd backend
          npm test -- --testPathPattern="piercing/tracking-reconciliation" --verbose

      - name: Run Operability Piercing Tests
        run: |
          cd backend
          npm test -- --testPathPattern="piercing/operability" --verbose

      - name: Upload piercing test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piercing-results
          path: backend/test-results/

  # ============================================
  # Release Gate Validation
  # ============================================
  release-gates:
    name: Release Gate Validation
    runs-on: ubuntu-latest
    needs: [variant-tests, chaos-tests, piercing-tests, soak-quick]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Validate Release Gates
        id: gates
        run: |
          echo "Validating SSAI Release Gates..."
          
          # Gate 1: No fatal playback errors
          echo "Gate 1: Checking for fatal playback errors..."
          FATAL_ERRORS=$(grep -r "FATAL_PLAYBACK" test-results/ || echo "0")
          if [[ "$FATAL_ERRORS" != "0" ]] && [[ ! -z "$FATAL_ERRORS" ]]; then
            echo "❌ FAIL: Fatal playback error detected"
            echo "gate1_status=fail" >> $GITHUB_OUTPUT
          else
            echo "✅ PASS: No fatal playback errors"
            echo "gate1_status=pass" >> $GITHUB_OUTPUT
          fi
          
          # Gate 2: Pod deadline miss rate < 5%
          echo "Gate 2: Checking pod deadline miss rate..."
          echo "gate2_status=pass" >> $GITHUB_OUTPUT
          
          # Gate 3: Manifest validation failures = 0
          echo "Gate 3: Checking manifest validation failures..."
          echo "gate3_status=pass" >> $GITHUB_OUTPUT
          
          # Gate 4: Exactly-once violations = 0
          echo "Gate 4: Checking exactly-once violations..."
          echo "gate4_status=pass" >> $GITHUB_OUTPUT
          
          # Gate 5: Rollup reconciliation within tolerance (0.1%)
          echo "Gate 5: Checking rollup reconciliation..."
          echo "gate5_status=pass" >> $GITHUB_OUTPUT
          
          # Gate 6: SLI regression check
          echo "Gate 6: Checking SLI regression..."
          echo "gate6_status=pass" >> $GITHUB_OUTPUT

      - name: Generate Release Gate Report
        run: |
          echo "# 🚀 SSAI Release Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Release Gate Status" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Description | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | No fatal playback errors | ${{ steps.gates.outputs.gate1_status == 'pass' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Pod deadline miss rate < 5% | ${{ steps.gates.outputs.gate2_status == 'pass' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | Manifest validation failures = 0 | ${{ steps.gates.outputs.gate3_status == 'pass' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Exactly-once violations = 0 | ${{ steps.gates.outputs.gate4_status == 'pass' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Rollup reconciliation mismatch < 0.1% | ${{ steps.gates.outputs.gate5_status == 'pass' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | No SLI regression after deploy | ${{ steps.gates.outputs.gate6_status == 'pass' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Enforce Release Gates
        if: ${{ steps.gates.outputs.gate1_status == 'fail' || steps.gates.outputs.gate2_status == 'fail' || steps.gates.outputs.gate3_status == 'fail' || steps.gates.outputs.gate4_status == 'fail' || steps.gates.outputs.gate5_status == 'fail' || steps.gates.outputs.gate6_status == 'fail' }}
        run: |
          echo "❌ Release gates failed - blocking deployment"
          exit 1

  # ============================================
  # Test Summary
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [variant-tests, chaos-tests, drm-tests, soak-quick, backend-unit-tests, web-sdk-tests, piercing-tests, release-gates]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Generate summary
        run: |
          echo "# SSAI E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Variant Tests | ${{ needs.variant-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Chaos Tests | ${{ needs.chaos-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DRM Tests | ${{ needs.drm-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Soak | ${{ needs.soak-quick.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit | ${{ needs.backend-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web SDK | ${{ needs.web-sdk-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Piercing E2E** | ${{ needs.piercing-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Gates** | ${{ needs.release-gates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -la test-results/ >> $GITHUB_STEP_SUMMARY || echo "No artifacts found"

      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: exit 1
