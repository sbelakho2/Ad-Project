# Deployment inventory for the current product. No secrets and no addresses
# live here; every value comes from the service environment file. Two hosts:
# the console host runs apex-api, the ingest and runner jobs and the sync
# push; the control host runs apex-control, ClickHouse, the sales services
# and the sync pull (see README.md, "Hosting split").

[api]
service = "apex-api"
listen = "127.0.0.1:8787"
env_file = "/etc/apex/api.env"
unit = "infrastructure/systemd/apex-api.service"

[control]
service = "apex-control"
listen = "127.0.0.1:8790"
env_file = "/etc/apex/control.env"
unit = "infrastructure/systemd/apex-control.service"

[runner]
service = "apex-runner"
schedule = "audit 02:30 UTC, cycle 03:00 UTC, daily 05:00 UTC, monthly 05:30 UTC on the 1st"
snapshot_root = ".apex/snapshots"
ledger_root = ".apex/ledgers"
proposals_root = ".apex/proposals"
env_file = "/etc/apex/runner.env"
units = [
  "infrastructure/systemd/apex-runner-audit.service",
  "infrastructure/systemd/apex-runner-audit.timer",
  "infrastructure/systemd/apex-runner-cycle.service",
  "infrastructure/systemd/apex-runner-cycle.timer",
  "infrastructure/systemd/apex-runner-daily.service",
  "infrastructure/systemd/apex-runner-daily.timer",
  "infrastructure/systemd/apex-runner-monthly.service",
  "infrastructure/systemd/apex-runner-monthly.timer",
]

[ingest]
service = "apex-ingest"
schedule = "hourly"
access_log = "/var/log/caddy/apex-access.json"
spool = ".apex/analytics-spool/apex-ingest.jsonl"
env_file = "/etc/apex/ingest.env"
unit = "infrastructure/systemd/apex-ingest.service"
timer = "infrastructure/systemd/apex-ingest.timer"

[sales]
# Owner-only outbound engine; never exposed to customers.
service = "apex-sales"
schedule = "hourly"
discover_schedule = "daily 01:15 UTC"
state = ".apex/sales"
env_file = "/etc/apex/sales.env"
unit = "infrastructure/systemd/apex-sales-run.service"
timer = "infrastructure/systemd/apex-sales-run.timer"
discover_unit = "infrastructure/systemd/apex-sales-discover.service"
discover_timer = "infrastructure/systemd/apex-sales-discover.timer"

[sales-web]
# Owner-only workspace UI over the sales engine's state; loopback-only and
# fail-closed without APEX_SALES_WEB_TOKEN.
service = "apex-sales-web"
listen = "127.0.0.1:8795"
state = ".apex/sales"
env_file = "/etc/apex/sales-web.env"
unit = "infrastructure/systemd/apex-sales-web.service"

[watch]
# The paid daily app-ads.txt watch: the daily check/diff/alert job and the
# monthly billing pass. The crate holds no platform keys and no runner; the
# only shared state is public (subscriber rows, fetched app-ads.txt text).
service = "apex-watch"
schedule = "daily 05:00 UTC"
bill_schedule = "monthly, first of month 06:00 UTC"
state = ".apex/watch"
env_file = "/etc/apex/watch.env"
unit = "infrastructure/systemd/apex-watch.service"
timer = "infrastructure/systemd/apex-watch.timer"
bill_unit = "infrastructure/systemd/apex-watch-bill.service"
bill_timer = "infrastructure/systemd/apex-watch-bill.timer"

[site]
build = "zola build"
root = "/srv/site/public"

[console]
# The separate public console origin: the whole origin proxies to apex-api,
# so `/` is the console overview and `/console/*` the console pages. Set
# APEX_CONSOLE_URL to https://<domain> so sign-in links land here.
domain = "console.apexmediation.ee"
upstream = "127.0.0.1:8787"

[edge]
config = "infrastructure/caddy/Caddyfile"

[monitoring]
prometheus = "monitoring/prometheus.yml"
alertmanager_template = "monitoring/alertmanager.yml"

[clickhouse]
service = "clickhouse-server"
purpose = "analytics and event store (replaces the historical Postgres analytics tables)"
listen_http = "127.0.0.1:8123"
listen_tcp = "127.0.0.1:9000"
data = ".apex/clickhouse"
dev_config = "infrastructure/clickhouse/config.xml"
compose = "infrastructure/clickhouse/docker-compose.yml"

[sync-push]
# Console host to object storage; one-way upload of the ledger directory,
# the invoice register and the leads (+signin) files, then the manifest.
host = "console"
service = "apex-sync-push"
schedule = "every 15 minutes"
env_file = "/etc/apex/sync.env"
unit = "infrastructure/systemd/apex-sync-push.service"
timer = "infrastructure/systemd/apex-sync-push.timer"

[sync-pull]
# Control host from object storage; verifies every manifest hash, installs
# the ledger, the invoice register and the sales imports, and writes the
# sync marker last.
host = "control"
service = "apex-sync-pull"
schedule = "every 15 minutes, offset 5"
env_file = "/etc/apex/sync.env"
unit = "infrastructure/systemd/apex-sync-pull.service"
timer = "infrastructure/systemd/apex-sync-pull.timer"
