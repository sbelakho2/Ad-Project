# Nginx reverse proxy for ApexMediation (Hetzner App Server: 46.62.252.96)
# Production: TLS is terminated via Caddy with auto Let's Encrypt.
# This file is retained for reference. Caddy is the primary reverse proxy on Hetzner.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection $connection_upgrade;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Security headers
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options SAMEORIGIN;
add_header Referrer-Policy no-referrer-when-downgrade;
add_header X-XSS-Protection "1; mode=block";
# HSTS: enable after HTTPS is working (uncomment next line)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

upstream api_upstream {
  server backend:8080;
}

upstream config_upstream {
  server config:8081;
}

upstream auction_upstream {
  server auction:8082;
}

# Phase 8: Console is optional and not started by default (compose profile `ui`).
# To avoid hard dependency and startup failure when `console` service is absent,
# we disable the console upstream here. Re-enable for Phase 2/production UI.
# upstream console_upstream {
#   server console:3000;
# }

server {
  listen 80 default_server;
  # Match any host locally, plus production hostnames
  server_name _ api.apexmediation.ee localhost 127.0.0.1;

  # Canonical SDK endpoints
  location = /config { return 301 /config/; }
  location /config/ {
    proxy_pass http://config_upstream/;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location = /auction { return 301 /auction/; }
  location /auction/ {
    proxy_pass http://auction_upstream/;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location /health {
    proxy_pass http://api_upstream/health;
  }

  location /metrics {
    # Optional: protect metrics in production
    # Example — Basic Auth (create htpasswd and mount in compose)
    # include /etc/nginx/snippets/metrics-basic-auth.conf;
    proxy_pass http://api_upstream/metrics;
  }

  location / {
    proxy_pass http://api_upstream;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }
}

server {
  listen 80;
  server_name apexmediation.ee www.apexmediation.ee;

  # For local/plain HTTP or pre-TLS, forward Next.js static/image paths explicitly
  location ^~ /_next/static/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location ^~ /_next/image/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }
}

server {
  listen 80;
  server_name console.apexmediation.ee;

  location / {
    proxy_pass http://console:3000;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }
}

server {
  listen 80;
  server_name admin.apexmediation.ee;

  location / {
    proxy_pass http://control-plane:4000;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }
}

# Explicit localhost server block to override default.conf hostname match during local Phase 8
server {
  listen 80;
  server_name localhost 127.0.0.1;

  location = /config { return 301 /config/; }
  location /config/ {
    proxy_pass http://config_upstream/;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location = /auction { return 301 /auction/; }
  location /auction/ {
    proxy_pass http://auction_upstream/;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location /health {
    proxy_pass http://api_upstream/health;
  }

  location /metrics {
    proxy_pass http://api_upstream/metrics;
  }

  location / {
    proxy_pass http://api_upstream;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }
}

