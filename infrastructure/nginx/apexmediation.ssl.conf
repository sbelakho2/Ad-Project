## Website (marketing/landing page) over HTTPS — Next.js standalone on port 3002
server {
  listen 443 ssl http2;
  server_name apexmediation.ee www.apexmediation.ee;

  ssl_certificate     /etc/letsencrypt/live/apexmediation.ee/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/apexmediation.ee/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  ssl_stapling on;
  ssl_stapling_verify on;

  # Important: pass Next.js static/image paths through directly to the Node app
  location ^~ /_next/static/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location ^~ /_next/image/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Everything else goes to the Next.js server
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Optional: long-cache immutable assets for better performance
  location ~* ^/_next/static/(?:css|chunks|media)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3002;
  }
}