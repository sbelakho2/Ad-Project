networks:
  apex-net:
    driver: bridge

services:
  control-plane:
    build:
      context: ../
      dockerfile: control-plane/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4000

      # Operator Authentication (separate realm)
      - OPERATOR_JWT_SECRET=${OPERATOR_JWT_SECRET:?OPERATOR_JWT_SECRET is required}
      - OPERATOR_SESSION_TTL_HOURS=${OPERATOR_SESSION_TTL_HOURS:-4}
      # email:hash,email2:hash2 (JSON map also accepted)
      - OPERATOR_CREDENTIALS=${OPERATOR_CREDENTIALS:?OPERATOR_CREDENTIALS is required}

      # Database (read-only)
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-apexmediation}
      - DB_USER=${DB_READONLY_USER:-apex_readonly}
      - DB_PASSWORD=${DB_READONLY_PASSWORD:?DB_READONLY_PASSWORD required}
      - DB_SSL=${DB_SSL:-false}

      # Database (operator / break-glass) for actions
      - DB_OPERATOR_USER=${DB_OPERATOR_USER:-apex_operator}
      - DB_OPERATOR_PASSWORD=${DB_OPERATOR_PASSWORD:?DB_OPERATOR_PASSWORD required}
      - DB_BREAKGLASS_USER=${DB_BREAKGLASS_USER:-apex_breakglass}
      - DB_BREAKGLASS_PASSWORD=${DB_BREAKGLASS_PASSWORD:-}

      # Device approvals (email-confirm new devices)
      - DEVICE_APPROVAL_ENABLED=${DEVICE_APPROVAL_ENABLED:-true}
      - DEVICE_APPROVAL_EMAIL_TO=contact@apexmediation.ee
      - PUBLIC_ORIGIN=https://admin.apexmediation.ee
      - DEVICE_CHALLENGE_TTL_MINUTES=${DEVICE_CHALLENGE_TTL_MINUTES:-30}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST required}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-contact@apexmediation.ee}

      # CORS (admin hostname)
      - CORS_ORIGIN=https://admin.apexmediation.ee

      # Telemetry sources
      - BACKEND_METRICS_URL=http://backend:8080/metrics
    expose:
      - "4000"
    networks:
      - apex-net

  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8080
      # Local default points to the local postgres service; override with real DO URL on droplet
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/apexmediation}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      # Local default points to the internal redis service with password
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-local-strong-password}@redis:6379/0}
      - CORS_ALLOWLIST=https://console.apexmediation.ee,https://apexmediation.ee,https://www.apexmediation.ee
      # Minimal secrets required to satisfy backend env validation in local prod-like runs
      - JWT_SECRET=${JWT_SECRET:-local-secret-0123456789abcdef0123456789abcd}
      - COOKIE_SECRET=${COOKIE_SECRET:-local-cookie-0123456789abcdef0123456789}
    expose:
      - "8080"
    networks:
      - apex-net

  config:
    build:
      context: ../backend/config
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=8081
      - ENV=production
      - REDIS_ADDR=redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/apexmediation}
      # Persist keys in a volume in real production; for local prod-like runs it will self-generate.
      - SIGNING_KEY_PATH=/keys/signing.key
    expose:
      - "8081"
    networks:
      - apex-net

  auction:
    build:
      context: ../backend/auction
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=8082
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-local-strong-password}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/apexmediation}
      # Web SDK / tooling access (browser only). Keep tight in real prod.
      - CORS_ORIGIN=${AUCTION_CORS_ORIGIN:-https://apexmediation.ee}
    expose:
      - "8082"
    networks:
      - apex-net

  console:
    profiles:
      - ui
    build:
      context: ../console
      args:
        # Provide the public API URL at build time for Next.js static configuration
        NEXT_PUBLIC_API_URL: https://api.apexmediation.ee/api/v1
        # Gate type-checker during infra verification builds to avoid blocking on dev-only TS issues
        NEXT_IGNORE_TS_ERRORS: "1"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.apexmediation.ee/api/v1
    expose:
      - "3000"
    networks:
      - apex-net
    depends_on:
      - backend

  website:
    profiles:
      - ui
    build:
      context: ../website
      args:
        NEXT_PUBLIC_API_URL: https://api.apexmediation.ee/api/v1
        NEXT_PUBLIC_CONSOLE_URL: https://console.apexmediation.ee
        NEXT_PUBLIC_SITE_URL: https://apexmediation.ee
        NEXT_IGNORE_TS_ERRORS: "1"
    environment:
      - NODE_ENV=production
    expose:
      - "3001"
    networks:
      - apex-net

  redis:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:-local-strong-password}",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--appendonly", "yes"
    ]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD:-local-strong-password} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - apex-net
    expose:
      - "6379"

  # Optional local Postgres for pre‑DO validation (private bridge only)
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=apexmediation
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apexmediation"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - apex-net
    expose:
      - "5432"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - config
      - auction
      - control-plane
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "443:443"
    volumes:
      - ./nginx/apexmediation.conf:/etc/nginx/conf.d/apexmediation.conf:ro
      - ./nginx/apexmediation.ssl.conf:/etc/nginx/conf.d/apexmediation.ssl.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Optional: Basic Auth for /metrics — mount htpasswd directory
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      # Bind-mount host certs issued by certbot (run certbot on the droplet host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - apex-net

  # Optional self-hosted object storage (MinIO) for artifacts/backups
  # Enabled via compose profile `storage`. Do NOT expose to the public Internet.
  minio:
    profiles:
      - storage
    image: minio/minio:RELEASE.2024-09-22T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-apexadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-apexadminstrongpassword}
    healthcheck:
      test: ["CMD", "bash", "-c", "mc alias set local http://localhost:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/data
    expose:
      - "9000" # S3 API (internal only)
      - "9001" # Console (internal only)
    networks:
      - apex-net

volumes:
  minio-data:
