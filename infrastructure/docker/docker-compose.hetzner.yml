# Hetzner Production Docker Compose
#
# ⚠️ IMPORTANT: This compose file is for the Hetzner App Server (46.62.252.96) ONLY.
#
# Architecture:
#   - PostgreSQL runs on DB Server (77.42.44.35) as a system service, NOT in Docker
#   - Redis runs on App Server as a system service, NOT in Docker
#   - Backend connects to remote PostgreSQL via DATABASE_URL in .env
#   - Backend connects to local Redis via REDIS_URL (172.17.0.1:6379)
#
# Do NOT include postgres or redis services here - they are system services.
#
# Usage:
#   cd /opt/adproject
#   docker compose -f docker-compose.hetzner.yml up -d --build

networks:
  apex-net:
    driver: bridge
  monitoring_monitoring:
    external: true

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      # Redis runs as system service on App Server, accessible via Docker bridge
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ApexRedis2025!}@172.17.0.1:6379/0
      # PostgreSQL runs on DB Server (77.42.44.35) - DATABASE_URL from .env
      # Features
      - BILLING_ENABLED=true
      - VRA_ENABLED=true
      - AB_TESTING_ENABLED=true
      - MIGRATION_STUDIO_ENABLED=true
      - TRANSPARENCY_ENABLED=true
      # Monitoring (internal network)
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      # Stripe (from .env)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    restart: unless-stopped
    networks:
      - apex-net
      - monitoring_monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # No depends_on for postgres/redis - they are external system services

  console:
    build:
      context: ./console
      args:
        NEXT_PUBLIC_API_URL: https://api.apexmediation.ee/api/v1
        NEXT_IGNORE_TS_ERRORS: "1"
        NEXT_PUBLIC_OPERATOR_EMAILS: ${NEXT_PUBLIC_OPERATOR_EMAILS:-sabelakhoua@gmail.com,admin@apexmediation.ee}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.apexmediation.ee/api/v1
      - NEXTAUTH_URL=https://console.apexmediation.ee
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    restart: unless-stopped
    networks:
      - apex-net
      - monitoring_monitoring
    depends_on:
      backend:
        condition: service_healthy

# NOTE: The following services are NOT included because they run as system services:
#
# PostgreSQL 16:
#   - Runs on DB Server (77.42.44.35) as systemd service
#   - Accessible from App Server via private network
#   - Connection string in .env: DATABASE_URL=postgresql://...@77.42.44.35:5432/adproject
#
# Redis 7:
#   - Runs on App Server (46.62.252.96) as systemd service
#   - Accessible from Docker via bridge network (172.17.0.1:6379)
#   - Password: REDIS_PASSWORD in .env
#
# Control Plane:
#   - Runs as systemd service on App Server
#   - Port 4000, accessible via admin.apexmediation.ee
#
# Website:
#   - Runs via PM2 on App Server
#   - Port 3002, accessible via apexmediation.ee
