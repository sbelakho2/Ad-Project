# Backend API Alerting Rules
# ApexMediation Production Monitoring

groups:
  - name: backend_api
    interval: 30s
    rules:
      # ============================================
      # AVAILABILITY ALERTS
      # ============================================
      - alert: BackendAPIDown
        expr: up{job="backend-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: backend
          tier: api
        annotations:
          summary: "Backend API is down"
          description: "Backend API ({{ $labels.instance }}) has been unreachable for more than 2 minutes."
          runbook_url: "https://docs.apexmediation.ee/runbooks/backend-api-down"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="backend-api",status_code=~"5.."}[5m])) 
          / 
          sum(rate(http_request_duration_seconds_count{job="backend-api"}[5m])) 
          > 0.05
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "High 5xx error rate detected"
          description: "5xx error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook_url: "https://docs.apexmediation.ee/runbooks/http-error-spike"

      - alert: VeryHighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="backend-api",status_code=~"5.."}[5m])) 
          / 
          sum(rate(http_request_duration_seconds_count{job="backend-api"}[5m])) 
          > 0.15
        for: 2m
        labels:
          severity: critical
          service: backend
          page: "true"
        annotations:
          summary: "CRITICAL: Very high error rate - possible outage"
          description: "5xx error rate is {{ $value | humanizePercentage }} (threshold: 15%)"

      # ============================================
      # LATENCY ALERTS
      # ============================================
      - alert: HighP50Latency
        expr: |
          histogram_quantile(0.50, 
            sum(rate(http_request_duration_seconds_bucket{job="backend-api"}[5m])) by (le)
          ) > 0.2
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Elevated median latency"
          description: "P50 latency is {{ $value | humanizeDuration }} (threshold: 200ms)"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95, 
            sum(rate(http_request_duration_seconds_bucket{job="backend-api"}[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High P95 latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"
          runbook_url: "https://docs.apexmediation.ee/runbooks/high-api-latency"

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99, 
            sum(rate(http_request_duration_seconds_bucket{job="backend-api"}[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Critical P99 latency"
          description: "P99 latency is {{ $value | humanizeDuration }} (threshold: 1s)"

      # ============================================
      # RESOURCE ALERTS
      # ============================================
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="backend-api"} / 1024 / 1024 > 450
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High memory usage"
          description: "Backend is using {{ $value | printf \"%.0f\" }}MB of memory (limit: 512MB)"

      - alert: CriticalMemoryUsage
        expr: process_resident_memory_bytes{job="backend-api"} / 1024 / 1024 > 480
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Critical memory usage - OOM risk"
          description: "Backend is using {{ $value | printf \"%.0f\" }}MB of memory, approaching OOM"

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds{job="backend-api"} > 0.1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Event loop lag detected"
          description: "Node.js event loop lag is {{ $value | humanizeDuration }}"

      - alert: HighOpenFileDescriptors
        expr: process_open_fds{job="backend-api"} / process_max_fds{job="backend-api"} > 0.8
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High file descriptor usage"
          description: "{{ $value | humanizePercentage }} of file descriptors in use"

      # ============================================
      # TRAFFIC ALERTS
      # ============================================
      - alert: LowTraffic
        expr: sum(rate(http_request_duration_seconds_count{job="backend-api"}[10m])) < 0.1
        for: 30m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Unusually low traffic"
          description: "Request rate is {{ $value | printf \"%.2f\" }} req/s, expected higher"

      - alert: TrafficSpike
        expr: |
          sum(rate(http_request_duration_seconds_count{job="backend-api"}[5m])) 
          > 
          2 * avg_over_time(sum(rate(http_request_duration_seconds_count{job="backend-api"}[5m]))[1h:5m])
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Traffic spike detected"
          description: "Current traffic is 2x higher than the hourly average"
