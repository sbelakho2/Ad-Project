# Infrastructure Alerting Rules
# ApexMediation Production Monitoring

groups:
  - name: infrastructure
    interval: 30s
    rules:
      # ============================================
      # CPU ALERTS
      # ============================================
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical CPU usage"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      # ============================================
      # MEMORY ALERTS
      # ============================================
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: CriticalMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 5m
        labels:
          severity: critical
          service: system
          page: "true"
        annotations:
          summary: "Critical memory usage - OOM risk"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: SwapUsage
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 50
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High swap usage"
          description: "Swap usage is {{ $value | printf \"%.1f\" }}% - possible memory pressure"

      # ============================================
      # DISK ALERTS
      # ============================================
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 20
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Low disk space"
          description: "{{ $labels.mountpoint }} has only {{ $value | printf \"%.1f\" }}% free space"

      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical: Disk space critically low"
          description: "{{ $labels.mountpoint }} has only {{ $value | printf \"%.1f\" }}% free space"
          runbook_url: "https://docs.apexmediation.ee/runbooks/disk-space-critical"

      - alert: DiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*60*60) < 0
        for: 1h
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Disk will fill in 24 hours"
          description: "{{ $labels.mountpoint }} is predicted to run out of space within 24 hours"

      - alert: HighDiskIO
        expr: |
          rate(node_disk_io_time_seconds_total[5m]) > 0.9
        for: 15m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk I/O utilization"
          description: "Disk {{ $labels.device }} is {{ $value | humanizePercentage }} utilized"

      # ============================================
      # NETWORK ALERTS
      # ============================================
      - alert: HighNetworkErrors
        expr: |
          rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 10
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Network errors detected"
          description: "{{ $value }} errors/second on {{ $labels.device }}"

      - alert: HighNetworkTraffic
        expr: |
          rate(node_network_receive_bytes_total{device!~"lo|docker.*|br-.*"}[5m]) > 100000000
          OR
          rate(node_network_transmit_bytes_total{device!~"lo|docker.*|br-.*"}[5m]) > 100000000
        for: 15m
        labels:
          severity: info
          service: system
        annotations:
          summary: "High network traffic"
          description: "Network traffic on {{ $labels.device }} is {{ $value | humanize }}B/s"

      # ============================================
      # CONTAINER ALERTS
      # ============================================
      - alert: ContainerHighCPU
        expr: |
          sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.name }} is using {{ $value | printf \"%.1f\" }}% CPU"

      - alert: ContainerHighMemory
        expr: |
          container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100 > 85
        for: 10m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.name }} is using {{ $value | printf \"%.1f\" }}% of its memory limit"

      - alert: ContainerRestarted
        expr: increase(container_restart_count{name!=""}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 10 minutes"

      - alert: ContainerDown
        expr: |
          time() - container_last_seen{name!=""} > 60
        for: 1m
        labels:
          severity: critical
          service: containers
        annotations:
          summary: "Container is down"
          description: "Container {{ $labels.name }} has been down for more than 1 minute"

      # ============================================
      # SYSTEM HEALTH
      # ============================================
      - alert: SystemClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "System clock skew detected"
          description: "Clock offset is {{ $value | humanizeDuration }}"

      - alert: TooManyOpenFiles
        expr: |
          node_filefd_allocated / node_filefd_maximum > 0.8
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Too many open file descriptors"
          description: "{{ $value | humanizePercentage }} of file descriptors in use"
