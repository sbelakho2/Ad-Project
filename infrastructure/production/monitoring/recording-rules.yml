# ApexMediation Recording Rules
# Pre-computed metrics for faster dashboard queries
# GDPR-Compliant: No PII stored

groups:
  - name: rtb_recording_rules
    interval: 30s
    rules:
      # Fill rate calculation
      - record: rtb:fill_rate:5m
        expr: sum(rate(rtb_ad_served_total[5m])) / sum(rate(rtb_ad_request_total[5m]))
      
      # Average eCPM
      - record: rtb:ecpm:5m
        expr: sum(rate(rtb_revenue_total[5m])) / sum(rate(rtb_impression_total[5m])) * 1000
      
      # Adapter response time P95
      - record: rtb:adapter_response_time_p95:5m
        expr: histogram_quantile(0.95, sum(rate(rtb_adapter_response_time_bucket[5m])) by (le, adapter))
      
      # Revenue by adapter (hourly rollup)
      - record: rtb:revenue_by_adapter:1h
        expr: sum(increase(rtb_revenue_total[1h])) by (adapter)

  - name: api_recording_rules
    interval: 30s
    rules:
      # API success rate
      - record: api:success_rate:5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_count{code=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count[5m]))
          )
      
      # API P99 latency
      - record: api:latency_p99:5m
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
      
      # Requests per second
      - record: api:request_rate:5m
        expr: sum(rate(http_request_duration_seconds_count[5m]))

  - name: billing_recording_rules
    interval: 60s
    rules:
      # Payment success rate
      - record: billing:payment_success_rate:5m
        expr: |
          sum(rate(billing_payment_total{status="success"}[5m]))
          /
          sum(rate(billing_payment_total[5m]))
      
      # Daily revenue
      - record: billing:revenue_daily
        expr: sum(increase(billing_payment_amount_total{status="success"}[24h]))
      
      # MRR growth rate
      - record: billing:mrr_growth_rate:30d
        expr: (billing_mrr_total - billing_mrr_total offset 30d) / billing_mrr_total offset 30d

  - name: database_recording_rules
    interval: 30s
    rules:
      # Connection pool utilization
      - record: pg:connection_utilization
        expr: pg_stat_activity_count{datname="adproject"} / pg_settings_max_connections * 100
      
      # Cache hit ratio
      - record: pg:cache_hit_ratio:5m
        expr: |
          sum(rate(pg_stat_database_blks_hit{datname="adproject"}[5m]))
          /
          (sum(rate(pg_stat_database_blks_hit{datname="adproject"}[5m])) + sum(rate(pg_stat_database_blks_read{datname="adproject"}[5m])))
      
      # Transaction rate
      - record: pg:transaction_rate:5m
        expr: sum(rate(pg_stat_database_xact_commit{datname="adproject"}[5m]))

  - name: infrastructure_recording_rules
    interval: 30s
    rules:
      # Node CPU usage
      - record: node:cpu_usage:5m
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
      
      # Node memory usage
      - record: node:memory_usage
        expr: |
          100 * (1 - (
            (node_memory_MemAvailable_bytes or node_memory_MemFree_bytes + node_memory_Buffers_bytes + node_memory_Cached_bytes)
            /
            node_memory_MemTotal_bytes
          ))
      
      # Disk usage
      - record: node:disk_usage
        expr: |
          100 * (1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ))
