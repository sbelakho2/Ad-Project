# Alertmanager Configuration for ApexMediation
# GDPR-Compliant: No PII in alerts

global:
  smtp_smarthost: '${SMTP_HOST:-mail.apexmediation.ee}:${SMTP_PORT:-587}'
  smtp_from: 'alerts@apexmediation.ee'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: true
  
  # Slack webhook (set in environment if using)
  # slack_api_url: '${SLACK_WEBHOOK_URL}'

# Alert templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  receiver: 'default'
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      
    # Warning alerts - batched
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 4h
      
    # Payment alerts - special handling
    - match:
        service: billing
      receiver: 'billing-alerts'
      group_wait: 30s
      repeat_interval: 2h
      
    # Database alerts
    - match:
        service: database
      receiver: 'database-alerts'
      group_wait: 30s
      repeat_interval: 2h

# Receivers
receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@apexmediation.ee'
        send_resolved: true
        headers:
          Subject: '[ApexMediation] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'ops@apexmediation.ee,oncall@apexmediation.ee'
        send_resolved: true
        headers:
          Subject: '🚨 [CRITICAL] {{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'
    # Uncomment for Slack integration
    # slack_configs:
    #   - channel: '#alerts-critical'
    #     send_resolved: true
    #     title: '🚨 {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'ops@apexmediation.ee'
        send_resolved: true
        headers:
          Subject: '⚠️ [WARNING] {{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'

  - name: 'billing-alerts'
    email_configs:
      - to: 'billing@apexmediation.ee,ops@apexmediation.ee'
        send_resolved: true
        headers:
          Subject: '💳 [BILLING] {{ .GroupLabels.alertname }}'

  - name: 'database-alerts'
    email_configs:
      - to: 'dba@apexmediation.ee,ops@apexmediation.ee'
        send_resolved: true
        headers:
          Subject: '🗄️ [DATABASE] {{ .GroupLabels.alertname }}'

# Inhibition rules - prevent alert storms
inhibit_rules:
  # If API is down, don't alert on individual endpoint failures
  - source_match:
      alertname: 'BackendAPIDown'
    target_match_re:
      alertname: 'HighErrorRate|HighLatency|EndpointDown'
    equal: ['service']
    
  # If database is down, don't alert on API issues
  - source_match:
      alertname: 'PostgreSQLDown'
    target_match_re:
      alertname: 'BackendAPIDown|HighErrorRate|HighLatency'
      
  # Critical suppresses warning for same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
